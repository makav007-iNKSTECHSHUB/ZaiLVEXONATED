<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZaiLVEXONATED | Official Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #050505;
            color: #f3f3f3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        .top-bar {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: flex-end;
            padding-top: 10px;
        }
        select {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            margin: auto 0;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #e50914;
            font-weight: bold;
            margin: 0 auto 16px auto;
            background-color: #121212;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .handle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
            font-family: monospace;
        }
        .bio {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .link-btn:hover, .link-btn:active {
            background-color: #222;
            border-color: #e50914;
        }
        .footer {
            padding: 20px 0;
            font-size: 0.75rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="langSelect" onchange="switchLanguage(this.value)">
            <option value="EN">🇬🇧 EN</option>
            <option value="RU">🇷🇺 RU</option>
            <option value="AR">🇸🇦 AR</option>
            <option value="KO">🇰🇷 KO</option>
        </select>
    </div>

    <div class="container">
        <div class="avatar">Z</div>
        <h1>ZaiLVEXONATED</h1>
        <div class="handle">@ZaiLVEXONATED</div>
        <p class="bio" id="mainBio">Official digital hub & creative vault. Tap below to access verified platforms.</p>

        <div class="links-list">
            <a href="https://t.me/zailvexonated" class="link-btn" target="_blank" data-i18n-key="tg">🔥 Telegram Vault</a>
            <a href="https://linktr.ee/zailvexonated" class="link-btn" target="_blank" data-i18n-key="lt">🔗 Linktree Hub</a>
            <a href="https://x.com/ZaiLVEXONATED" class="link-btn" target="_blank" data-i18n-key="x">✖ X (Twitter)</a>
            <a href="https://bsky.app/profile/digimedplay.bsky.social" class="link-btn" target="_blank" data-i18n-key="bs">🦋 Bluesky Profile</a>
            <a href="https://www.facebook.com/share/14j3dHAd47k/" class="link-btn" target="_blank" data-i18n-key="fb">📘 Facebook Page</a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 ZaiLVEXONATED. All Rights Reserved.
    </div>

    <script>
        const dictionary = {
            EN: {
                bio: "Official digital hub & creative vault. Tap below to access verified platforms.",
                tg: "🔥 Telegram Vault",
                lt: "🔗 Linktree Hub",
                x: "✖ X (Twitter)",
                bs: "🦋 Bluesky Profile",
                fb: "📘 Facebook Page"
            },
            RU: {
                bio: "Официальный цифровой хаб и творческий архив. Переходите на проверенные платформы ниже.",
                tg: "🔥 Telegram Канал",
                lt: "🔗 Linktree Хаб",
                x: "✖ X (Твиттер)",
                bs: "🦋 Bluesky Профиль",
                fb: "📘 Страница Facebook"
            },
            AR: {
                bio: "المنصة الرقمية الرسمية والأرشيف الإبداعي. اضغط أدناه للوصول إلى المنصات المعتمدة.",
                tg: "🔥 قناة تيليجرام",
                lt: "🔗 بوابة Linktree",
                x: "✖ منصة X",
                bs: "🦋 حساب Bluesky",
                fb: "📘 صفحة فيسبوك"
            },
            KO: {
                bio: "공식 디지털 허브 및 크리에이티브 볼트. 아래 플랫폼에서 확인하세요.",
                tg: "🔥 텔레그램 볼트",
                lt: "🔗 링크트리 허브",
                x: "✖ X (트위터)",
                bs: "🦋 블루스카이 프로필",
                fb: "📘 페이스북 페이지"
            }
        };

        function switchLanguage(lang) {
            const t = dictionary[lang];
            if (!t) return;

            document.getElementById('mainBio').textContent = t.bio;
            document.querySelector('[data-i18n-key="tg"]').textContent = t.tg;
            document.querySelector('[data-i18n-key="lt"]').textContent = t.lt;
            document.querySelector('[data-i18n-key="x"]').textContent = t.x;
            document.querySelector('[data-i18n-key="bs"]').textContent = t.bs;
            document.querySelector('[data-i18n-key="fb"]').textContent = t.fb;
        }
    </script>
</body>
</html>
